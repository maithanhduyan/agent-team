server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy the orchestrator API through the compose network
    # (the browser only talks to this origin, so no CORS needed).
    location /api/ {
        proxy_pass http://orchestrator:8000;
        proxy_set_header Host $host;
    }
    location = /healthz {
        proxy_pass http://orchestrator:8000;
        proxy_set_header Host $host;
    }
}
